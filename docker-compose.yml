version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: drivable-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: drivable
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "5432:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

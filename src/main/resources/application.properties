spring.application.name=Driveable

spring.datasource.url=jdbc:mysql://localhost:3306/drivable?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password

spring.data.jdbc.dialect=mysql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

security.jwt.secret=""
security.jwt.expiration-time=3600000

springdoc.swagger-ui.path=/swagger-ui.html


# --- Email Service Configurations ---
spring.mail.host=mail.example.com
spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password-or-normal-password # For Gmail, use an App Password!
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Optional: Trust all hosts for SSL (useful for local testing, but be cautious in production)
# spring.mail.properties.mail.smtp.ssl.trust=*

# Custom property for the default 'from' address
mail.from-address=noreply@yourdomain.com
